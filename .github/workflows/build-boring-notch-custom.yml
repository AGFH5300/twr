name: Build Final Boring Notch v8

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout build host
        uses: actions/checkout@v4

      - name: Select Xcode 26.6
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version

      - name: Clone Boring Notch
        run: |
          git clone https://github.com/TheBoredTeam/boring.notch.git boring-notch-v8
          cd boring-notch-v8
          git checkout 71e50d8a5edc1010ceffa34f34348157183b76e4
          git status --short

      - name: Apply cross-app fullscreen watcher v8
        working-directory: boring-notch-v8
        run: |
          python3 "$GITHUB_WORKSPACE/.github/scripts/patch-boring-notch-v8.py"
          git diff --check
          git diff -- \
            boringNotch/boringNotchApp.swift \
            boringNotch/models/BoringViewModel.swift \
            boringNotch/ContentView.swift \
            boringNotch/components/Notch/BoringNotchSkyLightWindow.swift

      - name: Resolve Swift packages
        working-directory: boring-notch-v8
        run: |
          xcodebuild -resolvePackageDependencies \
            -project boringNotch.xcodeproj \
            -scheme boringNotch

      - name: Build Release app
        working-directory: boring-notch-v8
        run: |
          set -o pipefail
          xcodebuild clean build \
            -project boringNotch.xcodeproj \
            -scheme boringNotch \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath "$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO | tee build.log

      - name: Mark and ad-hoc sign app
        working-directory: boring-notch-v8
        run: |
          APP="$PWD/build/Build/Products/Release/boringNotch.app"
          test -d "$APP"
          /usr/libexec/PlistBuddy -c 'Add :FullscreenFixVersion string v8-crossapp-pointer-animation' "$APP/Contents/Info.plist"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          echo "Fullscreen fix marker: $(/usr/libexec/PlistBuddy -c 'Print :FullscreenFixVersion' "$APP/Contents/Info.plist")"

      - name: Package v8 app
        working-directory: boring-notch-v8
        run: |
          APP="$PWD/build/Build/Products/Release/boringNotch.app"
          OUT="$GITHUB_WORKSPACE/boringNotch-fullscreen-fix-v8.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$OUT"
          shasum -a 256 "$OUT" > "$GITHUB_WORKSPACE/boringNotch-fullscreen-fix-v8.sha256"
          cat "$GITHUB_WORKSPACE/boringNotch-fullscreen-fix-v8.sha256"

      - name: Upload v8 Boring Notch
        uses: actions/upload-artifact@v4
        with:
          name: boringNotch-fullscreen-fix-v8
          path: |
            boringNotch-fullscreen-fix-v8.zip
            boringNotch-fullscreen-fix-v8.sha256
          if-no-files-found: error
          retention-days: 7
