name: Build Final Boring Notch

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout build host
        uses: actions/checkout@v4

      - name: Select Xcode 26.6
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version

      - name: Clone Boring Notch
        run: |
          git clone https://github.com/TheBoredTeam/boring.notch.git boring-notch-final
          cd boring-notch-final
          git checkout 71e50d8a5edc1010ceffa34f34348157183b76e4
          git status --short

      - name: Apply fullscreen panel-only hide patch
        working-directory: boring-notch-final
        run: |
          python3 <<'PY'
          from pathlib import Path

          app_path = Path("boringNotch/boringNotchApp.swift")
          app = app_path.read_text()

          old = (
              "    private var windowScreenDidChangeObserver: Any?\n"
              "    private var dragDetectors: [String: DragDetector] = [:] // UUID -> DragDetector\n"
          )
          new = (
              "    private var windowScreenDidChangeObserver: Any?\n"
              "    private var fullscreenVisibilityCancellable: AnyCancellable?\n"
              "    private var dragDetectors: [String: DragDetector] = [:] // UUID -> DragDetector\n"
          )
          if old not in app:
              raise SystemExit("AppDelegate property anchor not found")
          app = app.replace(old, new, 1)

          marker_start = app.find("    private func cleanupDragDetectors() {")
          marker_end = app.find("    private func setupDragDetectors()", marker_start)
          if marker_start == -1 or marker_end == -1:
              raise SystemExit("AppDelegate method anchor not found")
          cleanup_block = app[marker_start:marker_end]

          method_lines = [
              "    // In fullscreen hide only the floating notch panel.",
              "    // The app process and menu-bar/status item remain alive.",
              "    @MainActor",
              "    private func applyFullscreenWindowVisibility(",
              "        _ fullscreenStatus: [String: Bool],",
              "        enabled: Bool",
              "    ) {",
              "        func apply(to notchWindow: NSWindow, shouldHide: Bool) {",
              "            if shouldHide {",
              "                if notchWindow.isVisible {",
              "                    notchWindow.orderOut(nil)",
              "                }",
              "            } else {",
              "                if !notchWindow.isVisible {",
              "                    notchWindow.orderFrontRegardless()",
              "                }",
              "            }",
              "        }",
              "",
              "        if Defaults[.showOnAllDisplays] {",
              "            for (uuid, notchWindow) in windows {",
              "                let shouldHide = enabled && (fullscreenStatus[uuid] ?? false)",
              "                apply(to: notchWindow, shouldHide: shouldHide)",
              "            }",
              "        } else if let notchWindow = window {",
              "            let uuid = vm.screenUUID ?? coordinator.selectedScreenUUID",
              "            let shouldHide = enabled && (fullscreenStatus[uuid] ?? false)",
              "            apply(to: notchWindow, shouldHide: shouldHide)",
              "        }",
              "    }",
              "",
              "",
          ]
          app = app[:marker_start] + cleanup_block + "\n".join(method_lines) + app[marker_end:]

          old = "        setupDragDetectors()\n\n        if coordinator.firstLaunch {\n"
          if old not in app:
              raise SystemExit("Launch anchor not found")

          launch_lines = [
              "        // Native event-driven fullscreen detection: hide only the notch panel.",
              "        let fullscreenEnabledPublisher = Defaults",
              "            .publisher(.hideNotchOption)",
              "            .map(\\.newValue)",
              "            .map { $0 != .never }",
              "            .removeDuplicates()",
              "",
              "        fullscreenVisibilityCancellable = Publishers.CombineLatest(",
              "            FullscreenMediaDetector.shared.$fullscreenStatus.removeDuplicates(),",
              "            fullscreenEnabledPublisher",
              "        )",
              "        .receive(on: RunLoop.main)",
              "        .sink { [weak self] fullscreenStatus, enabled in",
              "            guard let self = self else { return }",
              "            Task { @MainActor in",
              "                self.applyFullscreenWindowVisibility(fullscreenStatus, enabled: enabled)",
              "            }",
              "        }",
              "",
              "        Task { @MainActor in",
              "            self.applyFullscreenWindowVisibility(",
              "                FullscreenMediaDetector.shared.fullscreenStatus,",
              "                enabled: Defaults[.hideNotchOption] != .never",
              "            )",
              "        }",
              "",
              "        setupDragDetectors()",
              "",
              "        if coordinator.firstLaunch {",
              "",
          ]
          app = app.replace(old, "\n".join(launch_lines), 1)
          app_path.write_text(app)

          if "orderOut(nil)" not in app:
              raise SystemExit("orderOut missing")
          if "orderFrontRegardless()" not in app:
              raise SystemExit("restore missing")
          if "ignoresMouseEvents = isFullscreen" in app or "fullscreenCollapsed" in app:
              raise SystemExit("old inert-visible fullscreen patch unexpectedly present")

          print("Fullscreen panel-only hide patch applied")
          print("App stays running: yes")
          print("Menu-bar item unaffected: yes")
          print("Floating notch visible in fullscreen: no")
          PY

          git diff --check
          git diff -- boringNotch/boringNotchApp.swift

      - name: Resolve Swift packages
        working-directory: boring-notch-final
        run: |
          xcodebuild -resolvePackageDependencies \
            -project boringNotch.xcodeproj \
            -scheme boringNotch

      - name: Build Release app
        working-directory: boring-notch-final
        run: |
          set -o pipefail
          xcodebuild clean build \
            -project boringNotch.xcodeproj \
            -scheme boringNotch \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath "$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO | tee build.log

      - name: Locate and ad-hoc sign app
        working-directory: boring-notch-final
        run: |
          APP="$PWD/build/Build/Products/Release/boringNotch.app"
          test -d "$APP"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist"

      - name: Package final app
        working-directory: boring-notch-final
        run: |
          APP="$PWD/build/Build/Products/Release/boringNotch.app"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$GITHUB_WORKSPACE/boringNotch-final.zip"
          shasum -a 256 "$GITHUB_WORKSPACE/boringNotch-final.zip" > "$GITHUB_WORKSPACE/boringNotch-final.sha256"
          cat "$GITHUB_WORKSPACE/boringNotch-final.sha256"

      - name: Upload final Boring Notch
        uses: actions/upload-artifact@v4
        with:
          name: boringNotch-final
          path: |
            boringNotch-final.zip
            boringNotch-final.sha256
          if-no-files-found: error
          retention-days: 7
