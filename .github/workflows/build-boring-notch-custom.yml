name: Build Final Boring Notch

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout build host
        uses: actions/checkout@v4

      - name: Select Xcode 26.6
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version

      - name: Clone Boring Notch
        run: |
          git clone https://github.com/TheBoredTeam/boring.notch.git boring-notch-final
          cd boring-notch-final
          git checkout 71e50d8a5edc1010ceffa34f34348157183b76e4
          git status --short

      - name: Apply fullscreen collapse and click-through patch
        working-directory: boring-notch-final
        run: |
          python3 <<'PY'
          from pathlib import Path

          # ------------------------------------------------------------------
          # 1) BoringViewModel: fullscreen should COLLAPSE, never disappear.
          # ------------------------------------------------------------------
          vm_path = Path("boringNotch/models/BoringViewModel.swift")
          vm = vm_path.read_text()

          old = "    @Published var hideOnClosed: Bool = true\n"
          new = "    @Published var hideOnClosed: Bool = false\n    @Published var fullscreenCollapsed: Bool = false\n"
          if old not in vm:
              raise SystemExit("BoringViewModel anchor 1 not found")
          vm = vm.replace(old, new, 1)

          old = '''            .sink { [weak self] shouldHide in
                withAnimation(.smooth) {
                    self?.hideOnClosed = shouldHide
                }
            }
'''
          new = '''            .sink { [weak self] _ in
                // In fullscreen we keep the closed notch visible in its normal
                // menu-bar position. AppDelegate handles click-through behavior.
                withAnimation(.smooth) {
                    self?.hideOnClosed = false
                }
            }
'''
          if old not in vm:
              raise SystemExit("BoringViewModel anchor 2 not found")
          vm = vm.replace(old, new, 1)

          old = '''    func open() {
        self.notchSize = openNotchSize
        self.notchState = .open
'''
          new = '''    func open() {
        // While a fullscreen app occupies this display, remain collapsed so the
        // notch cannot expand over browser tabs or fullscreen controls.
        guard !fullscreenCollapsed else { return }
        self.notchSize = openNotchSize
        self.notchState = .open
'''
          if old not in vm:
              raise SystemExit("BoringViewModel anchor 3 not found")
          vm = vm.replace(old, new, 1)

          old = '''    func close() {
        // Do not close while a share picker or sharing service is active
        if SharingStateManager.shared.preventNotchClose {
            return
        }
'''
          new = '''    func close(force: Bool = false) {
        // Normal closes still respect sharing state. Fullscreen collapse may
        // force the notch closed because it must never cover fullscreen UI.
        if !force && SharingStateManager.shared.preventNotchClose {
            return
        }
'''
          if old not in vm:
              raise SystemExit("BoringViewModel anchor 4 not found")
          vm = vm.replace(old, new, 1)

          vm_path.write_text(vm)

          # ------------------------------------------------------------------
          # 2) AppDelegate: keep NSPanel visible, but make it click-through and
          #    force the view model into its ordinary closed/menu-bar state.
          # ------------------------------------------------------------------
          app_path = Path("boringNotch/boringNotchApp.swift")
          app = app_path.read_text()

          old = "    private var windowScreenDidChangeObserver: Any?\n    private var dragDetectors: [String: DragDetector] = [:] // UUID -> DragDetector\n"
          new = "    private var windowScreenDidChangeObserver: Any?\n    private var fullscreenCollapseCancellable: AnyCancellable?\n    private var dragDetectors: [String: DragDetector] = [:] // UUID -> DragDetector\n"
          if old not in app:
              raise SystemExit("AppDelegate anchor 1 not found")
          app = app.replace(old, new, 1)

          marker_start = app.find("    private func cleanupDragDetectors() {")
          marker_end = app.find("    private func setupDragDetectors()", marker_start)
          if marker_start == -1 or marker_end == -1:
              raise SystemExit("AppDelegate anchor 2 not found")
          cleanup_block = app[marker_start:marker_end]

          addition = cleanup_block + '''    // Fullscreen behavior for this custom build:
    // - keep the Boring Notch panel on-screen;
    // - force it into the normal collapsed/menu-bar appearance;
    // - pass mouse events through to the fullscreen app underneath.
    // This avoids blocking Chrome/Safari tabs without making the notch vanish.
    @MainActor
    private func applyFullscreenCollapse(
        _ fullscreenStatus: [String: Bool],
        enabled: Bool
    ) {
        func apply(
            window notchWindow: NSWindow,
            viewModel: BoringViewModel,
            screenUUID: String?
        ) {
            let isFullscreen = enabled
                && screenUUID.map { fullscreenStatus[$0] ?? false } == true

            viewModel.fullscreenCollapsed = isFullscreen
            notchWindow.ignoresMouseEvents = isFullscreen

            if isFullscreen {
                viewModel.close(force: true)
            }
        }

        if Defaults[.showOnAllDisplays] {
            for (uuid, notchWindow) in windows {
                guard let viewModel = viewModels[uuid] else { continue }
                apply(window: notchWindow, viewModel: viewModel, screenUUID: uuid)
            }
        } else if let notchWindow = window {
            let uuid = vm.screenUUID ?? coordinator.selectedScreenUUID
            apply(window: notchWindow, viewModel: vm, screenUUID: uuid)
        }
    }

'''
          app = app[:marker_start] + addition + app[marker_end:]

          old = "        setupDragDetectors()\n\n        if coordinator.firstLaunch {\n"
          if old not in app:
              raise SystemExit("AppDelegate anchor 3 not found")

          new = '''        // Reuse Boring Notch's native event-driven fullscreen detector. The
        // panel remains visible; only expansion and mouse interception are disabled.
        let fullscreenEnabledPublisher = Defaults
            .publisher(.hideNotchOption)
            .map(\\.newValue)
            .map { $0 != .never }
            .removeDuplicates()

        fullscreenCollapseCancellable = Publishers.CombineLatest(
            FullscreenMediaDetector.shared.$fullscreenStatus.removeDuplicates(),
            fullscreenEnabledPublisher
        )
        .receive(on: RunLoop.main)
        .sink { [weak self] fullscreenStatus, enabled in
            guard let self = self else { return }
            Task { @MainActor in
                self.applyFullscreenCollapse(fullscreenStatus, enabled: enabled)
            }
        }

        Task { @MainActor in
            self.applyFullscreenCollapse(
                FullscreenMediaDetector.shared.fullscreenStatus,
                enabled: Defaults[.hideNotchOption] != .never
            )
        }

        setupDragDetectors()

        if coordinator.firstLaunch {
'''
          app = app.replace(old, new, 1)
          app_path.write_text(app)

          # Safety assertions: this final build must never use orderOut for our
          # fullscreen behavior and must include both collapse + click-through.
          if "fullscreenCollapsed" not in app or "ignoresMouseEvents = isFullscreen" not in app:
              raise SystemExit("Final fullscreen patch missing")
          if "applyFullscreenWindowVisibility" in app:
              raise SystemExit("Old hard-hide patch unexpectedly present")

          print("Final fullscreen patch applied successfully")
          print("Uses click-through:", "ignoresMouseEvents = isFullscreen" in app)
          print("Forces collapsed state:", "close(force: true)" in app)
          print("Old custom orderOut patch present:", "applyFullscreenWindowVisibility" in app)
          PY

          git diff --check
          git diff -- boringNotch/boringNotchApp.swift boringNotch/models/BoringViewModel.swift

      - name: Resolve Swift packages
        working-directory: boring-notch-final
        run: |
          xcodebuild -resolvePackageDependencies \
            -project boringNotch.xcodeproj \
            -scheme boringNotch

      - name: Build Release app
        working-directory: boring-notch-final
        run: |
          set -o pipefail
          xcodebuild clean build \
            -project boringNotch.xcodeproj \
            -scheme boringNotch \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath "$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO | tee build.log

      - name: Locate and ad-hoc sign app
        working-directory: boring-notch-final
        run: |
          APP="$PWD/build/Build/Products/Release/boringNotch.app"
          test -d "$APP"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist"

      - name: Package final app
        working-directory: boring-notch-final
        run: |
          APP="$PWD/build/Build/Products/Release/boringNotch.app"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$GITHUB_WORKSPACE/boringNotch-final.zip"
          shasum -a 256 "$GITHUB_WORKSPACE/boringNotch-final.zip" > "$GITHUB_WORKSPACE/boringNotch-final.sha256"
          cat "$GITHUB_WORKSPACE/boringNotch-final.sha256"

      - name: Upload final Boring Notch
        uses: actions/upload-artifact@v4
        with:
          name: boringNotch-final
          path: |
            boringNotch-final.zip
            boringNotch-final.sha256
          if-no-files-found: error
          retention-days: 7
