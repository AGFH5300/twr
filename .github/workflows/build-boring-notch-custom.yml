name: Build Final Boring Notch v3

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout build host
        uses: actions/checkout@v4

      - name: Select Xcode 26.6
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version

      - name: Clone Boring Notch
        run: |
          git clone https://github.com/TheBoredTeam/boring.notch.git boring-notch-v3
          cd boring-notch-v3
          git checkout 71e50d8a5edc1010ceffa34f34348157183b76e4
          git status --short

      - name: Apply fullscreen space suppression v3
        working-directory: boring-notch-v3
        run: |
          python3 <<'PY'
          from pathlib import Path

          # 1) Stop the notch NSPanel from being eligible for fullscreen Spaces.
          win_path = Path("boringNotch/components/Notch/BoringNotchSkyLightWindow.swift")
          win = win_path.read_text()
          old = """        collectionBehavior = [\n            .fullScreenAuxiliary,\n            .stationary,\n            .canJoinAllSpaces,\n            .ignoresCycle,\n        ]\n"""
          new = """        // Custom build: stay available on normal desktop Spaces, but do not\n        // join true macOS fullscreen Spaces. The app itself remains running.\n        collectionBehavior = [\n            .stationary,\n            .canJoinAllSpaces,\n            .ignoresCycle,\n        ]\n"""
          if old not in win:
              raise SystemExit("collectionBehavior anchor not found")
          win = win.replace(old, new, 1)
          win_path.write_text(win)

          # 2) Fallback: if macOS still presents the panel during a fullscreen
          # transition, make it fully transparent, non-interactive, and order it out.
          app_path = Path("boringNotch/boringNotchApp.swift")
          app = app_path.read_text()

          old = (
              "    private var windowScreenDidChangeObserver: Any?\n"
              "    private var dragDetectors: [String: DragDetector] = [:] // UUID -> DragDetector\n"
          )
          new = (
              "    private var windowScreenDidChangeObserver: Any?\n"
              "    private var fullscreenVisibilityCancellable: AnyCancellable?\n"
              "    private var fullscreenSuppressedScreens: Set<String> = []\n"
              "    private var dragDetectors: [String: DragDetector] = [:] // UUID -> DragDetector\n"
          )
          if old not in app:
              raise SystemExit("AppDelegate property anchor not found")
          app = app.replace(old, new, 1)

          marker_start = app.find("    private func cleanupDragDetectors() {")
          marker_end = app.find("    private func setupDragDetectors()", marker_start)
          if marker_start == -1 or marker_end == -1:
              raise SystemExit("AppDelegate method anchor not found")
          cleanup_block = app[marker_start:marker_end]

          method_lines = [
              "    @MainActor",
              "    private func applyFullscreenSuppression(",
              "        _ fullscreenStatus: [String: Bool],",
              "        enabled: Bool",
              "    ) {",
              "        func apply(to notchWindow: NSWindow, screenUUID: String) {",
              "            let shouldHide = enabled && (fullscreenStatus[screenUUID] ?? false)",
              "",
              "            if shouldHide {",
              "                fullscreenSuppressedScreens.insert(screenUUID)",
              "                notchWindow.ignoresMouseEvents = true",
              "                notchWindow.alphaValue = 0",
              "                notchWindow.orderOut(nil)",
              "            } else {",
              "                fullscreenSuppressedScreens.remove(screenUUID)",
              "                notchWindow.ignoresMouseEvents = false",
              "                notchWindow.alphaValue = 1",
              "                if !notchWindow.isVisible {",
              "                    notchWindow.orderFrontRegardless()",
              "                }",
              "            }",
              "        }",
              "",
              "        if Defaults[.showOnAllDisplays] {",
              "            for (uuid, notchWindow) in windows {",
              "                apply(to: notchWindow, screenUUID: uuid)",
              "            }",
              "        } else if let notchWindow = window {",
              "            let uuid = vm.screenUUID ?? coordinator.selectedScreenUUID",
              "            guard !uuid.isEmpty else { return }",
              "            apply(to: notchWindow, screenUUID: uuid)",
              "        }",
              "    }",
              "",
              "",
          ]
          app = app[:marker_start] + cleanup_block + "\n".join(method_lines) + app[marker_end:]

          # Make any later reposition/recreation respect fullscreen suppression.
          old = """        window.alphaValue = 1\n    }\n\n    func applicationDidFinishLaunching"""
          new = """        let uuid = screen.displayUUID\n        let isSuppressed = uuid.map { fullscreenSuppressedScreens.contains($0) } ?? false\n        window.ignoresMouseEvents = isSuppressed\n        window.alphaValue = isSuppressed ? 0 : 1\n        if isSuppressed {\n            window.orderOut(nil)\n        }\n    }\n\n    func applicationDidFinishLaunching"""
          if old not in app:
              raise SystemExit("positionWindow anchor not found")
          app = app.replace(old, new, 1)

          old = "        setupDragDetectors()\n\n        if coordinator.firstLaunch {\n"
          if old not in app:
              raise SystemExit("Launch anchor not found")

          launch_lines = [
              "        // Native event-driven fullscreen detection with hard suppression fallback.",
              "        let fullscreenEnabledPublisher = Defaults",
              "            .publisher(.hideNotchOption)",
              "            .map(\\.newValue)",
              "            .map { $0 != .never }",
              "            .removeDuplicates()",
              "",
              "        fullscreenVisibilityCancellable = Publishers.CombineLatest(",
              "            FullscreenMediaDetector.shared.$fullscreenStatus.removeDuplicates(),",
              "            fullscreenEnabledPublisher",
              "        )",
              "        .receive(on: RunLoop.main)",
              "        .sink { [weak self] fullscreenStatus, enabled in",
              "            guard let self = self else { return }",
              "            Task { @MainActor in",
              "                self.applyFullscreenSuppression(fullscreenStatus, enabled: enabled)",
              "            }",
              "        }",
              "",
              "        Task { @MainActor in",
              "            self.applyFullscreenSuppression(",
              "                FullscreenMediaDetector.shared.fullscreenStatus,",
              "                enabled: Defaults[.hideNotchOption] != .never",
              "            )",
              "        }",
              "",
              "        setupDragDetectors()",
              "",
              "        if coordinator.firstLaunch {",
              "",
          ]
          app = app.replace(old, "\n".join(launch_lines), 1)
          app_path.write_text(app)

          # 3) Remove the residual closed-notch drawing in fullscreen as a third fallback.
          vm_path = Path("boringNotch/models/BoringViewModel.swift")
          vm = vm_path.read_text()
          old = """    var effectiveClosedNotchHeight: CGFloat {\n        let currentScreen = screenUUID.flatMap { NSScreen.screen(withUUID: $0) }\n        let noNotchAndFullscreen = hideOnClosed && (currentScreen?.safeAreaInsets.top ?? 0 <= 0 || currentScreen == nil)\n        return noNotchAndFullscreen ? 0 : closedNotchSize.height\n    }\n"""
          new = """    var effectiveClosedNotchHeight: CGFloat {\n        // Custom build: when fullscreen detection says hide, collapse the SwiftUI\n        // notch content to zero even on a display with a physical notch.\n        return hideOnClosed ? 0 : closedNotchSize.height\n    }\n"""
          if old not in vm:
              raise SystemExit("effectiveClosedNotchHeight anchor not found")
          vm = vm.replace(old, new, 1)
          vm_path.write_text(vm)

          # Assertions for the exact behavior we want.
          assert ".fullScreenAuxiliary" not in win
          assert "fullscreenSuppressedScreens" in app
          assert "notchWindow.alphaValue = 0" in app
          assert "notchWindow.ignoresMouseEvents = true" in app
          assert "notchWindow.orderOut(nil)" in app
          assert "return hideOnClosed ? 0 : closedNotchSize.height" in vm

          print("v3 fullscreen suppression applied")
          print("fullScreenAuxiliary removed: yes")
          print("alpha-zero fallback: yes")
          print("mouse pass-through fallback: yes")
          print("orderOut fallback: yes")
          print("SwiftUI closed-notch height zero in fullscreen: yes")
          PY

          git diff --check
          git diff -- \
            boringNotch/components/Notch/BoringNotchSkyLightWindow.swift \
            boringNotch/boringNotchApp.swift \
            boringNotch/models/BoringViewModel.swift

      - name: Resolve Swift packages
        working-directory: boring-notch-v3
        run: |
          xcodebuild -resolvePackageDependencies \
            -project boringNotch.xcodeproj \
            -scheme boringNotch

      - name: Build Release app
        working-directory: boring-notch-v3
        run: |
          set -o pipefail
          xcodebuild clean build \
            -project boringNotch.xcodeproj \
            -scheme boringNotch \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath "$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO | tee build.log

      - name: Mark and ad-hoc sign app
        working-directory: boring-notch-v3
        run: |
          APP="$PWD/build/Build/Products/Release/boringNotch.app"
          test -d "$APP"

          /usr/libexec/PlistBuddy -c 'Add :FullscreenFixVersion string v3-space-suppression' "$APP/Contents/Info.plist"

          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

          echo "Bundle ID: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist")"
          echo "Fullscreen fix marker: $(/usr/libexec/PlistBuddy -c 'Print :FullscreenFixVersion' "$APP/Contents/Info.plist")"

      - name: Package v3 app
        working-directory: boring-notch-v3
        run: |
          APP="$PWD/build/Build/Products/Release/boringNotch.app"
          OUT="$GITHUB_WORKSPACE/boringNotch-fullscreen-fix-v3.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$OUT"
          shasum -a 256 "$OUT" > "$GITHUB_WORKSPACE/boringNotch-fullscreen-fix-v3.sha256"
          cat "$GITHUB_WORKSPACE/boringNotch-fullscreen-fix-v3.sha256"

      - name: Upload v3 Boring Notch
        uses: actions/upload-artifact@v4
        with:
          name: boringNotch-fullscreen-fix-v3
          path: |
            boringNotch-fullscreen-fix-v3.zip
            boringNotch-fullscreen-fix-v3.sha256
          if-no-files-found: error
          retention-days: 7
