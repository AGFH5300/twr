name: Build Final Boring Notch v6

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout build host
        uses: actions/checkout@v4

      - name: Select Xcode 26.6
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version

      - name: Clone Boring Notch
        run: |
          git clone https://github.com/TheBoredTeam/boring.notch.git boring-notch-v6
          cd boring-notch-v6
          git checkout 71e50d8a5edc1010ceffa34f34348157183b76e4
          git status --short

      - name: Apply alpha-only fullscreen reveal v6
        working-directory: boring-notch-v6
        run: |
          python3 <<'PY'
          from pathlib import Path

          app_path = Path("boringNotch/boringNotchApp.swift")
          app = app_path.read_text()

          old = (
              "    private var windowScreenDidChangeObserver: Any?\n"
              "    private var dragDetectors: [String: DragDetector] = [:] // UUID -> DragDetector\n"
          )
          new = (
              "    private var windowScreenDidChangeObserver: Any?\n"
              "    private var fullscreenVisibilityCancellable: AnyCancellable?\n"
              "    private var fullscreenStatusSnapshot: [String: Bool] = [:]\n"
              "    private var fullscreenBehaviorEnabled: Bool = false\n"
              "    private var fullscreenMenuBarRevealScreens: Set<String> = []\n"
              "    private var globalFullscreenMouseMonitor: Any?\n"
              "    private var localFullscreenMouseMonitor: Any?\n"
              "    private var menuBarHideWorkItems: [String: DispatchWorkItem] = [:]\n"
              "    private var dragDetectors: [String: DragDetector] = [:] // UUID -> DragDetector\n"
          )
          if old not in app:
              raise SystemExit("AppDelegate property anchor not found")
          app = app.replace(old, new, 1)

          old = (
              "        MusicManager.shared.destroy()\n"
              "        cleanupDragDetectors()\n"
              "        cleanupWindows()\n"
              "        XPCHelperClient.shared.stopMonitoringAccessibilityAuthorization()\n"
          )
          new = (
              "        MusicManager.shared.destroy()\n"
              "        menuBarHideWorkItems.values.forEach { $0.cancel() }\n"
              "        menuBarHideWorkItems.removeAll()\n"
              "        if let monitor = globalFullscreenMouseMonitor {\n"
              "            NSEvent.removeMonitor(monitor)\n"
              "            globalFullscreenMouseMonitor = nil\n"
              "        }\n"
              "        if let monitor = localFullscreenMouseMonitor {\n"
              "            NSEvent.removeMonitor(monitor)\n"
              "            localFullscreenMouseMonitor = nil\n"
              "        }\n"
              "        cleanupDragDetectors()\n"
              "        cleanupWindows()\n"
              "        XPCHelperClient.shared.stopMonitoringAccessibilityAuthorization()\n"
          )
          if old not in app:
              raise SystemExit("terminate anchor not found")
          app = app.replace(old, new, 1)

          marker_start = app.find("    private func cleanupDragDetectors() {")
          marker_end = app.find("    private func setupDragDetectors()", marker_start)
          if marker_start == -1 or marker_end == -1:
              raise SystemExit("method anchor not found")
          cleanup_block = app[marker_start:marker_end]

          method_lines = [
              "    @MainActor",
              "    private func refreshFullscreenRevealVisibility() {",
              "        func apply(",
              "            to notchWindow: NSWindow,",
              "            viewModel: BoringViewModel,",
              "            screenUUID: String",
              "        ) {",
              "            let isFullscreen = fullscreenBehaviorEnabled",
              "                && (fullscreenStatusSnapshot[screenUUID] ?? false)",
              "            let revealActive = fullscreenMenuBarRevealScreens.contains(screenUUID)",
              "            let shouldShow = !isFullscreen || revealActive",
              "",
              "            if shouldShow {",
              "                notchWindow.ignoresMouseEvents = false",
              "                notchWindow.alphaValue = 1",
              "                if !notchWindow.isVisible {",
              "                    notchWindow.orderFrontRegardless()",
              "                }",
              "            } else {",
              "                viewModel.close()",
              "                notchWindow.ignoresMouseEvents = true",
              "                notchWindow.alphaValue = 0",
              "                // IMPORTANT: do not orderOut here. Keeping the NSPanel",
              "                // resident in the fullscreen Space makes reveal reliable.",
              "            }",
              "        }",
              "",
              "        if Defaults[.showOnAllDisplays] {",
              "            for (uuid, notchWindow) in windows {",
              "                guard let viewModel = viewModels[uuid] else { continue }",
              "                apply(to: notchWindow, viewModel: viewModel, screenUUID: uuid)",
              "            }",
              "        } else if let notchWindow = window {",
              "            let uuid = vm.screenUUID ?? coordinator.selectedScreenUUID",
              "            guard !uuid.isEmpty else { return }",
              "            apply(to: notchWindow, viewModel: vm, screenUUID: uuid)",
              "        }",
              "    }",
              "",
              "    @MainActor",
              "    private func scheduleFullscreenRevealHide(for screenUUID: String) {",
              "        menuBarHideWorkItems[screenUUID]?.cancel()",
              "        let item = DispatchWorkItem { [weak self] in",
              "            Task { @MainActor in",
              "                guard let self = self else { return }",
              "                self.fullscreenMenuBarRevealScreens.remove(screenUUID)",
              "                self.menuBarHideWorkItems.removeValue(forKey: screenUUID)",
              "                self.refreshFullscreenRevealVisibility()",
              "            }",
              "        }",
              "        menuBarHideWorkItems[screenUUID] = item",
              "        DispatchQueue.main.asyncAfter(deadline: .now() + 0.55, execute: item)",
              "    }",
              "",
              "    @MainActor",
              "    private func handleFullscreenMouseActivity() {",
              "        let mouseLocation = NSEvent.mouseLocation",
              "        guard let screen = NSScreen.screens.first(where: { $0.frame.contains(mouseLocation) }),",
              "              let uuid = screen.displayUUID",
              "        else { return }",
              "",
              "        let isFullscreen = fullscreenBehaviorEnabled",
              "            && (fullscreenStatusSnapshot[uuid] ?? false)",
              "        guard isFullscreen else {",
              "            menuBarHideWorkItems[uuid]?.cancel()",
              "            menuBarHideWorkItems.removeValue(forKey: uuid)",
              "            fullscreenMenuBarRevealScreens.remove(uuid)",
              "            refreshFullscreenRevealVisibility()",
              "            return",
              "        }",
              "",
              "        let distanceFromTop = max(0, screen.frame.maxY - mouseLocation.y)",
              "        let topEdgeTrigger: CGFloat = 8",
              "        let interactionBand = max(",
              "            CGFloat(76),",
              "            screen.safeAreaInsets.top + 28,",
              "            NSStatusBar.system.thickness + 36",
              "        )",
              "",
              "        let viewModel: BoringViewModel?",
              "        if Defaults[.showOnAllDisplays] {",
              "            viewModel = viewModels[uuid]",
              "        } else {",
              "            viewModel = vm.screenUUID == uuid ? vm : nil",
              "        }",
              "        let interactingWithNotch = viewModel?.isMouseHovering(position: mouseLocation) ?? false",
              "",
              "        if distanceFromTop <= topEdgeTrigger {",
              "            menuBarHideWorkItems[uuid]?.cancel()",
              "            menuBarHideWorkItems.removeValue(forKey: uuid)",
              "            fullscreenMenuBarRevealScreens.insert(uuid)",
              "            refreshFullscreenRevealVisibility()",
              "            return",
              "        }",
              "",
              "        guard fullscreenMenuBarRevealScreens.contains(uuid) else { return }",
              "",
              "        if distanceFromTop <= interactionBand || interactingWithNotch {",
              "            menuBarHideWorkItems[uuid]?.cancel()",
              "            menuBarHideWorkItems.removeValue(forKey: uuid)",
              "            refreshFullscreenRevealVisibility()",
              "        } else {",
              "            scheduleFullscreenRevealHide(for: uuid)",
              "        }",
              "    }",
              "",
              "    @MainActor",
              "    private func setupFullscreenMouseMonitors() {",
              "        let mask: NSEvent.EventTypeMask = [",
              "            .mouseMoved,",
              "            .leftMouseDragged,",
              "            .leftMouseDown,",
              "            .leftMouseUp,",
              "        ]",
              "        globalFullscreenMouseMonitor = NSEvent.addGlobalMonitorForEvents(matching: mask) { [weak self] _ in",
              "            Task { @MainActor in self?.handleFullscreenMouseActivity() }",
              "        }",
              "        localFullscreenMouseMonitor = NSEvent.addLocalMonitorForEvents(matching: mask) { [weak self] event in",
              "            Task { @MainActor in self?.handleFullscreenMouseActivity() }",
              "            return event",
              "        }",
              "    }",
              "",
              "",
          ]
          app = app[:marker_start] + cleanup_block + "\n".join(method_lines) + app[marker_end:]

          old = "        window.alphaValue = 1\n    }\n\n    func applicationDidFinishLaunching"
          new = "        window.alphaValue = 1\n        refreshFullscreenRevealVisibility()\n    }\n\n    func applicationDidFinishLaunching"
          if old not in app:
              raise SystemExit("positionWindow anchor not found")
          app = app.replace(old, new, 1)

          old = "        setupDragDetectors()\n\n        if coordinator.firstLaunch {\n"
          if old not in app:
              raise SystemExit("launch anchor not found")
          launch_lines = [
              "        let fullscreenEnabledPublisher = Defaults",
              "            .publisher(.hideNotchOption)",
              "            .map(\\.newValue)",
              "            .map { $0 != .never }",
              "            .removeDuplicates()",
              "",
              "        fullscreenVisibilityCancellable = Publishers.CombineLatest(",
              "            FullscreenMediaDetector.shared.$fullscreenStatus.removeDuplicates(),",
              "            fullscreenEnabledPublisher",
              "        )",
              "        .receive(on: RunLoop.main)",
              "        .sink { [weak self] fullscreenStatus, enabled in",
              "            guard let self = self else { return }",
              "            Task { @MainActor in",
              "                self.fullscreenStatusSnapshot = fullscreenStatus",
              "                self.fullscreenBehaviorEnabled = enabled",
              "                if !enabled { self.fullscreenMenuBarRevealScreens.removeAll() }",
              "                self.refreshFullscreenRevealVisibility()",
              "            }",
              "        }",
              "",
              "        fullscreenStatusSnapshot = FullscreenMediaDetector.shared.fullscreenStatus",
              "        fullscreenBehaviorEnabled = Defaults[.hideNotchOption] != .never",
              "        setupFullscreenMouseMonitors()",
              "        refreshFullscreenRevealVisibility()",
              "",
              "        setupDragDetectors()",
              "",
              "        if coordinator.firstLaunch {",
              "",
          ]
          app = app.replace(old, "\n".join(launch_lines), 1)
          app_path.write_text(app)

          vm_path = Path("boringNotch/models/BoringViewModel.swift")
          vm = vm_path.read_text()
          old = (
              "            .sink { [weak self] shouldHide in\n"
              "                withAnimation(.smooth) {\n"
              "                    self?.hideOnClosed = shouldHide\n"
              "                }\n"
              "            }\n"
          )
          new = (
              "            .sink { [weak self] _ in\n"
              "                withAnimation(.smooth) {\n"
              "                    self?.hideOnClosed = false\n"
              "                }\n"
              "            }\n"
          )
          if old not in vm:
              raise SystemExit("BoringViewModel fullscreen sink anchor not found")
          vm = vm.replace(old, new, 1)
          vm_path.write_text(vm)

          win = Path("boringNotch/components/Notch/BoringNotchSkyLightWindow.swift").read_text()
          assert ".fullScreenAuxiliary" in win
          assert "notchWindow.alphaValue = 0" in app
          assert "do not orderOut here" in app
          assert "addGlobalMonitorForEvents" in app
          assert "fullscreenMenuBarRevealScreens.insert(uuid)" in app
          assert "self?.hideOnClosed = false" in vm

          print("v6 alpha-only fullscreen reveal applied")
          print("fullScreenAuxiliary retained: yes")
          print("hidden by alpha only: yes")
          print("window remains resident in fullscreen Space: yes")
          print("top-edge reveal event: yes")
          PY

          git diff --check
          git diff -- boringNotch/boringNotchApp.swift boringNotch/models/BoringViewModel.swift

      - name: Resolve Swift packages
        working-directory: boring-notch-v6
        run: |
          xcodebuild -resolvePackageDependencies \
            -project boringNotch.xcodeproj \
            -scheme boringNotch

      - name: Build Release app
        working-directory: boring-notch-v6
        run: |
          set -o pipefail
          xcodebuild clean build \
            -project boringNotch.xcodeproj \
            -scheme boringNotch \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath "$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO | tee build.log

      - name: Mark and ad-hoc sign app
        working-directory: boring-notch-v6
        run: |
          APP="$PWD/build/Build/Products/Release/boringNotch.app"
          test -d "$APP"
          /usr/libexec/PlistBuddy -c 'Add :FullscreenFixVersion string v6-alpha-reveal' "$APP/Contents/Info.plist"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          echo "Fullscreen fix marker: $(/usr/libexec/PlistBuddy -c 'Print :FullscreenFixVersion' "$APP/Contents/Info.plist")"

      - name: Package v6 app
        working-directory: boring-notch-v6
        run: |
          APP="$PWD/build/Build/Products/Release/boringNotch.app"
          OUT="$GITHUB_WORKSPACE/boringNotch-fullscreen-fix-v6.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$OUT"
          shasum -a 256 "$OUT" > "$GITHUB_WORKSPACE/boringNotch-fullscreen-fix-v6.sha256"
          cat "$GITHUB_WORKSPACE/boringNotch-fullscreen-fix-v6.sha256"

      - name: Upload v6 Boring Notch
        uses: actions/upload-artifact@v4
        with:
          name: boringNotch-fullscreen-fix-v6
          path: |
            boringNotch-fullscreen-fix-v6.zip
            boringNotch-fullscreen-fix-v6.sha256
          if-no-files-found: error
          retention-days: 7
